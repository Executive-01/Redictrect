
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="v" autoplay muted playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>

  <script>
    const v = document.getElementById("v");

    v.play().catch(() => {
      // Jika autoplay diblokir, browser memerlukan interaksi pengguna.
    });

    v.addEventListener("ended", () => {
      location.replace("https://smkn1-ngw.sch.id/");
    });
  </script>
</body>
</html>
